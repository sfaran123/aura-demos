# Kept moderate for a 15 GB machine: AGP 9 + R8 on the Dejavoo SDK is memory-heavy (as the POS app).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
# The project is on D: and plugin sources are in the pub cache on C:; Kotlin incremental
# compilation then fails with "Could not close incremental caches".
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Dejavoo Tap to Pay (TOP SDK). true: included when android/local.properties has the Dejavoo
# Maven credentials (dejavoo.env picks sandbox or prod; see android/build.gradle.kts).
# Needs Android 9+ with NFC; set false (or -Pdejavoo.top.enabled=false) for older tablets.
dejavoo.top.enabled=true
