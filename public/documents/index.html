<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AURA הפקת מסמכים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a keyboard-first sales desk. One command line at the top of every document, lines below, totals at the side (or under the thumb on phones). */
:root{
  --bg:#eef1f6; --surface:#ffffff; --sunk:#f6f7fb; --ink:#1c2540; --muted:#56617d; --line:#d9deea;
  --accent:#4f56e0; --accent-soft:#ecedff; --accent-ink:#373dbf; --on-accent:#ffffff; --mark:#e0a54a; --mark-soft:#fff1de; --mark-ink:#a85a07;
  --danger:#c2352b; --danger-soft:#fdeaea; --ok:#17804d; --ok-soft:#e3f5ec; --info:#373dbf; --info-soft:#ecedff;
  --hdr:#1c2540; --hdr-ink:#ffffff; --hdr-sub:#aeb6d0; --hdr-line:#34406a;
  --paper:#FFFFFF; --paper-ink:#1c2540; --paper-muted:#56617d; --paper-line:#d9deea; --paper-band:#f3f5fa;
  --shadow:0 1px 2px rgba(28,37,64,.06),0 8px 24px rgba(28,37,64,.08);
  --f-body:"Assistant","Rubik",system-ui,sans-serif;
  --f-disp:"Rubik","Assistant",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --tap:48px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11152a; --surface:#1a1f36; --sunk:#20263f; --ink:#eef0f8; --muted:#b0b7cf; --line:#323a58;
  --accent:#8a8dff; --accent-soft:#2a2e5c; --accent-ink:#c9caff; --on-accent:#12162a; --mark:#f0b061; --mark-soft:#3b2c16; --mark-ink:#f0b061;
  --danger:#ff8a80; --danger-soft:#3d1f22; --ok:#5fd39a; --ok-soft:#173a2a; --info:#c9caff; --info-soft:#2a2e5c;
  --hdr:#0b0e1d; --hdr-ink:#eef0f8; --hdr-sub:#8f98b8; --hdr-line:#262c48;
  --paper:#FBFCFB; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11152a; --surface:#1a1f36; --sunk:#20263f; --ink:#eef0f8; --muted:#b0b7cf; --line:#323a58;
  --accent:#8a8dff; --accent-soft:#2a2e5c; --accent-ink:#c9caff; --on-accent:#12162a; --mark:#f0b061; --mark-soft:#3b2c16; --mark-ink:#f0b061;
  --danger:#ff8a80; --danger-soft:#3d1f22; --ok:#5fd39a; --ok-soft:#173a2a; --info:#c9caff; --info-soft:#2a2e5c;
  --hdr:#0b0e1d; --hdr-ink:#eef0f8; --hdr-sub:#8f98b8; --hdr-line:#262c48;
  --paper:#FBFCFB; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--f-mono);font-size:.86em;direction:ltr;unicode-bidi:isolate}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--sunk);color:var(--muted);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hdr);color:var(--hdr-ink);border-bottom:1px solid var(--hdr-line)}
.top-in{max-width:1360px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{width:38px;height:38px;border:2px solid var(--hdr-ink);color:var(--hdr-ink);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:17px;flex:none}
.brandtxt{min-width:0;flex:1}
.brandtxt b{display:block;font-family:var(--f-disp);font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt span{display:block;font-size:12.5px;color:var(--hdr-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-demo{font-size:11px;font-weight:700;color:#1c2540;background:#fff1de;border:1px solid #e0a54a;border-radius:99px;padding:1px 8px;white-space:nowrap}
.nav{display:flex;gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--hdr-line);border-radius:12px;padding:3px}
.nav button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:600;font-size:14.5px;color:var(--hdr-sub);display:flex;gap:6px;align-items:center;min-height:38px;white-space:nowrap}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--mark)}
@media (max-width:640px){.nav{order:3;width:100%}.nav button{flex:1;justify-content:center}.chip-demo{display:none}}

.main{max-width:1360px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(25px,4.6vw,32px);line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.h2{font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.h2 small{font-weight:500;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* inputs */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:var(--tap);border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:16px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp[readonly]{background:var(--sunk);color:var(--muted)}
.inp.bad{border-color:var(--danger)}
textarea.inp{min-height:72px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.hint.bad{color:var(--danger)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:13px;top:50%;translate:0 -50%;width:20px;height:20px;color:var(--muted);pointer-events:none}
.search .inp{padding-inline-start:42px}
.btn{min-height:var(--tap);border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:9px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.7}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:13.5px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:600;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-open{background:var(--info-soft);color:var(--info)}
.st-partial{background:var(--mark-soft);color:var(--mark-ink)}
.st-closed,.st-final{background:var(--ok-soft);color:var(--ok)}
.tbadge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.toggle{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:6px 0}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.toggle b{display:block;font-weight:600;font-size:15px}
.toggle span{font-size:13px;color:var(--muted)}

/* home */
.home{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.home{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr)}}
.bigscan .inp{min-height:60px;font-size:18px;border-width:2px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.type{position:relative;text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;align-items:start;min-height:78px;transition:border-color .15s,transform .12s}
.type:hover{border-color:var(--accent)}
.type:active{transform:scale(.985)}
.type .ti{grid-row:span 2;width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.type .ti svg{width:22px;height:22px}
.type b{font-size:15.5px;padding-inline-end:44px}
.type span{font-size:12.5px;color:var(--muted);line-height:1.35}
.type kbd{position:absolute;top:10px;inset-inline-end:10px}
.draftcard{display:flex;gap:12px;align-items:center;border:1.5px solid var(--mark);background:var(--mark-soft);border-radius:var(--r);padding:12px 14px;flex-wrap:wrap}

/* editor */
.ed{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.ed{grid-template-columns:minmax(0,1fr) 340px}.edside{position:sticky;top:76px;align-self:start}}
.edhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.typesel{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 12px;font-family:var(--f-disp);font-weight:600;font-size:19px;max-width:100%}
.custchip{display:flex;gap:12px;align-items:center;text-align:start;flex:1;min-width:220px;border:1.5px dashed var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;min-height:56px}
.custchip.set{border-style:solid}
.custchip .ci{min-width:0;flex:1}
.custchip .ci>b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.custchip .ci>span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:38px;height:38px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--info);background:var(--info-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.cmdbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 51px);z-index:5;display:flex;gap:8px;background:var(--bg);padding-block:6px}
@media (max-width:640px){.cmdbar{top:calc(env(safe-area-inset-top,0px) + 100px)}}
.cmdbar .search{flex:1;min-width:0}
.cmdbar .inp{min-height:54px;font-size:17px;border-width:2px;border-color:var(--accent)}
.cmdhelp{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.pickbar{display:flex;align-items:center;gap:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;flex-wrap:wrap}
.prog{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}

.lines{display:flex;flex-direction:column;gap:6px}
.lhead,.ln{display:grid;grid-template-columns:26px 40px minmax(0,1fr) 140px 130px 110px;gap:10px;align-items:center}
.lhead.noimg,.ln.noimg{grid-template-columns:26px minmax(0,1fr) 140px 130px 110px}
.lhead{font-size:12px;color:var(--muted);font-weight:600;padding:0 12px}
.ln{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:58px}
.ln:hover{border-color:var(--muted)}
.ln.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ln .i{color:var(--muted);font-size:12.5px;text-align:center}
.ln .nm{min-width:0}
.ln .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .nm small{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ln .pr{text-align:end;font-size:14px}
.ln .pr s{color:var(--muted);font-size:12px}
.ln .tt{text-align:end;font-weight:700}
.dchip{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 6px}
.srcchip{font-size:11.5px;background:var(--info-soft);color:var(--info);border-radius:5px;padding:0 6px;font-weight:600}
.warnchip{font-size:11.5px;background:var(--danger-soft);color:var(--danger);border-radius:5px;padding:0 6px;font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:var(--sunk)}
.stepper button{width:40px;height:40px;border:0;background:none;font-size:20px;font-weight:600;color:var(--accent);display:grid;place-items:center}
.stepper span{min-width:48px;padding:0 4px;height:40px;display:grid;place-items:center;background:var(--surface);border-inline:1.5px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.thumb{width:40px;height:40px;border-radius:10px;overflow:hidden;flex:none;display:block}
.thumb svg{display:block;width:100%;height:100%}
@media (max-width:760px){
  .lhead{display:none}
  .ln{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"th nm tt" "th q pr";row-gap:6px}
  .ln.noimg{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm tt" "q pr"}
  .ln .i{display:none}.ln .thumb{grid-area:th;align-self:start}.ln .nm{grid-area:nm}.ln .tt{grid-area:tt}.ln .q{grid-area:q}.ln .pr{grid-area:pr}
}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);font-size:14.5px}
.tots{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14.5px}
.tots span:nth-child(even){text-align:end;font-variant-numeric:tabular-nums}
.tots .g{font-family:var(--f-disp);font-size:24px;border-top:1.5px solid var(--line);padding-top:8px;margin-top:3px}
.profit{border-radius:10px;background:var(--ok-soft);padding:8px 10px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.profit.low{background:var(--mark-soft)}.profit.neg{background:var(--danger-soft);color:var(--danger)}
details.card>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--muted)}
details[open].card>summary::after{content:"▴"}
.alloc{border:1px solid var(--mark);background:var(--mark-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}

/* list */
.lt-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dl{display:flex;flex-direction:column;gap:6px}
.dr{display:grid;grid-template-columns:28px 110px 70px minmax(0,1fr) 92px 110px 104px minmax(0,170px);gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:54px}
.dr.hd{background:none;border:0;cursor:default;font-size:12px;color:var(--muted);font-weight:600;min-height:0;padding-block:0}
.dr:not(.hd):hover{border-color:var(--muted)}
.dr.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dr.on{background:var(--accent-soft)}
.dr input{width:20px;height:20px;accent-color:var(--accent)}
.dr .c{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .chain{font-size:12px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .n{text-align:end}
.dr [data-mobno]{display:none}
@media (max-width:900px){
  .dr{grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"ck ty tt" "ck cu st" "ck ch dt"}
  .dr.hd{display:none}
  .dr>.k1{grid-area:ck}.dr>.k2{grid-area:ty}.dr>.k4{grid-area:cu}.dr>.k5{grid-area:dt;text-align:end;font-size:12.5px;color:var(--muted)}.dr>.k6{grid-area:tt}.dr>.k7{grid-area:st;justify-self:end}.dr>.k8{grid-area:ch}
  .dr>.k3{display:none}.dr [data-mobno]{display:inline}
}
.selbar{position:fixed;inset:auto 0 0;z-index:9;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.selbar-in{max-width:1360px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.selbar .btn{background:var(--surface);color:var(--ink);border-color:transparent}
.selbar .btn.primary{background:var(--accent);color:var(--on-accent)}

/* view */
.view{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.view{grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr)}}
.chainlist{display:flex;flex-direction:column;gap:6px}
.chainlist button{display:flex;gap:10px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 10px;min-height:44px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

/* document paper */
.docwrap{border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.doc{background:var(--paper);color:var(--paper-ink);padding:26px 24px 20px;font-size:12.5px;line-height:1.45;position:relative}
.doc .dh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding-bottom:12px;border-bottom:2px solid var(--paper-ink)}
.doc .biz b{font-family:var(--f-disp);font-weight:700;font-size:19px;display:block;line-height:1.15}
.doc .biz span{display:block;color:var(--paper-muted);font-size:11.5px}
.doc .dt{text-align:end}
.doc .dt b{display:block;font-size:17px}
.doc .dt .no{font-family:var(--f-mono);font-size:13px}
.doc .dt .draft{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:#8a5a00;background:#fbefcf;border-radius:4px;padding:1px 7px}
.doc .meta{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin:12px 0}
.doc .box{background:var(--paper-band);border-radius:6px;padding:9px 11px}
.doc .box small{display:block;color:var(--paper-muted);font-size:10.5px;font-weight:600}
.doc .box b{font-size:13.5px}
.doc .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.doc .kv span:nth-child(odd){color:var(--paper-muted)}
.doc table{width:100%;border-collapse:collapse;font-size:12px}
.doc th{font-size:10.5px;color:var(--paper-muted);font-weight:700;text-align:start;padding:6px 4px;border-bottom:1px solid var(--paper-line)}
.doc td{padding:6px 4px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.doc td.n,.doc th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}

function startDoc(type,o={}){
 draft=newDraft(type);if(o.cust){draft.cust=o.cust;const c=custOf(draft);if(c&&c.terms&&TYPES[draft.type].terms)draft.terms=c.terms}
 go("edit");
 if(o.product)addProduct(o.product,o.qty||1);
 else if(!draft.cust&&S.askCust)custModal();
}
function homeEnter(v){
 v=v.trim();
 if(!v){if(draft&&(draft.lines.length||draft.cust))go("edit");return}
 const pq=parseCmd(v),p=findProduct(pq.code);
 if(p){beep();return startDoc(null,{product:p,qty:pq.qty})}
 const c=customers.find(c=>c.code===v||c.tax===v);
 if(c){beep();return startDoc(null,{cust:c.id})}
 const m=customers.filter(c=>c.name.includes(v));
 if(m.length===1){beep();return startDoc(null,{cust:m[0].id})}
 draft=newDraft();go("edit");custModal(v);
}

/* ---------- EDITOR ---------- */
function parseCmd(v){let m=v.match(/^(\d+(?:[.,]\d+)?)\s*\*\s*(.+)$/);if(m)return{qty:num(m[1]),code:m[2].trim()};m=v.match(/^(.+?)\s*\*\s*(\d+(?:[.,]\d+)?)$/);if(m)return{qty:num(m[2]),code:m[1].trim()};return{qty:null,code:v.trim()}}
const findProduct=code=>PRODS.find(p=>p.bc===code||p.sku===code);
const custPrice=(c,p)=>c&&c.prices&&c.prices[p.sku]!=null?c.prices[p.sku]:null;
function lastSale(cid,sku){let best=null;for(const d of docs){if(d.cust!==cid||!TYPES[d.type].items||d.type==="credit"||d.type==="quote")continue;d.lines.forEach(l=>{if(l.sku===sku&&(!best||d.date>best.date))best={date:d.date,price:l.price,disc:l.disc,doc:d}})}return best}

  ${draft.pick?pickBar():""}
  <div class="cmdbar"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6v12M7 6v12M11 6v12M14 6v12M18 6v12M20 6v12"/></svg>
   <input class="inp" id="cmd" placeholder="${t.items?"סריקה, מק״ט או שם · 5*1001 לכמות":"סריקת כרטיס לקוח"}" autocomplete="off" enterkeyhint="done" aria-label="שורת סריקה" ${S.scanner?'inputmode="none"':""}></div>
   ${t.items?`<button class="btn" data-act="catalog" aria-label="קטלוג"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span class="kbonly">קטלוג <kbd>F4</kbd></span></button>`:""}

function pickBar(){const need=draft.lines.reduce((a,l)=>a+num(l.need),0),got=draft.lines.reduce((a,l)=>a+Math.min(num(l.qty),num(l.need)),0);return `<div class="pickbar"><b>ליקוט</b><span class="hint">${esc(draft.srcDocs.map(id=>label(docById(id))).join(", "))}</span><span class="prog"><i style="width:${need?Math.round(got/need*100):0}%"></i></span><b class="num">${qf(got)} / ${qf(need)}</b></div>`}
function rPick(){const pb=$(".pickbar");if(pb)pb.outerHTML=pickBar()}
function rLines(){
 const t=TYPES[draft.type],box=$("#lines");if(!box)return;
 if(!t.items){
  box.innerHTML=draft.closes.length?`<div class="lines">${draft.closes.map((c,i)=>{const s=docById(c.d);return `<div class="ln noimg" style="cursor:default"><span class="i">${i+1}</span><div class="nm"><b>${TYPES[c.t].name} ${c.no}</b><small>${s?dfmt(s.date)+" · סה״כ "+money(tot(s).total):""}</small></div><span class="q"></span><span class="pr">יתרה</span><span class="tt num">${money(c.due)}</span></div>`}).join("")}</div>`:`<div class="empty">קבלה כללית. אפשר לצרף חשבוניות פתוחות של הלקוח (F3), או להפיק ולרשום סכום (F9).</div>`;
  return;
 }

 box.innerHTML=draft.lines.length?`<div class="lines" role="listbox" aria-label="שורות המסמך">
  <div class="lhead ${img}"><span>#</span>${S.images?"<span></span>":""}<span>פריט</span><span>כמות</span><span style="text-align:end">מחיר נטו</span><span style="text-align:end">סה״כ</span></div>
  ${draft.lines.map((l,i)=>{const p=P(l.sku),over=l.max!=null&&num(l.qty)>l.max+1e-9&&!draft.pick;return `<div class="ln ${img} ${i===sel?"sel":""}" data-line="${i}" role="option" aria-selected="${i===sel}">
   <span class="i">${i+1}</span>${S.images?thumb(p?p.cat:"free"):""}
   <div class="nm"><b>${esc(l.name)||'<span class="muted">ללא תיאור</span>'}</b><small>${l.sku?'<span class="mono">'+l.sku+"</span>":""}<span>${esc(l.unit||"")}</span>${l.src?`<span class="srcchip">${TYPES[l.src.t].short} ${l.src.no}</span>`:""}${draft.pick&&l.need!=null?`<span class="${num(l.qty)>=l.need?"dchip":"srcchip"}">לוקט ${qf(num(l.qty))} מתוך ${qf(l.need)}</span>`:""}${over?`<span class="warnchip">מעל היתרה (${qf(l.max)})</span>`:""}</small></div>
   <div class="q"><span class="stepper"><button data-q="1" aria-label="עוד אחד" tabindex="-1">+</button><span class="num">${qf(num(l.qty))}</span><button data-q="-1" aria-label="אחד פחות" tabindex="-1">−</button></span></div>
   <div class="pr num">${num(l.disc)?`<s>${NF.format(num(l.price))}</s> `:""}${NF.format(r2(num(l.price)*(1-num(l.disc)/100)))}${num(l.disc)?` <span class="dchip">−${pct(num(l.disc))}</span>`:""}</div>
   <div class="tt num">${money(lineNet(l))}</div></div>`}).join("")}</div>`:`<div class="empty">${draft.pick?"סרקו את הפריטים מהמדף.":"סרקו מוצר, הקלידו מק״ט, או פתחו את הקטלוג."}<br><span class="hint">לדוגמה: <span class="mono">3*1002</span> ואז Enter</span></div>`;
}
function rDet(){
 const t=TYPES[draft.type],box=$("#det");if(!box)return;
 const c=custOf(draft),tt=tot(draft);
 const alloc=biz.mode==="m"&&(draft.type==="tax"||draft.type==="taxrc")&&c&&c.tax&&tt.net>=ALLOC_MIN;
 box.innerHTML=`<div class="grid2">
  <div class="field"><label for="d_date">תאריך</label><input class="inp" type="date" id="d_date" value="${draft.date}"></div>
  ${t.terms?`<div class="field"><label for="d_terms">תנאי תשלום</label><select class="inp" id="d_terms">${Object.entries(TERMS).map(([k,v])=>`<option value="${k}" ${draft.terms===k?"selected":""}>${v}</option>`).join("")}</select><span class="hint" id="dueH">עד ${dfmt(termDate(draft.terms,draft.date))}</span></div>`:""}
  ${t.valid?`<div class="field"><label for="d_valid">בתוקף עד</label><input class="inp" type="date" id="d_valid" value="${draft.valid}"></div>`:""}
  ${t.supply?`<div class="field"><label for="d_supply">אספקה</label><input class="inp" type="date" id="d_supply" value="${draft.supply}"></div>`:""}
  ${t.ref?`<div class="field"><label for="d_ref">לחשבונית מספר *</label><input class="inp" id="d_ref" inputmode="numeric" value="${esc(draft.ref)}"></div>`:""}
  ${t.items?`<div class="field"><label for="d_disc">הנחת מסמך %</label><input class="inp" id="d_disc" inputmode="decimal" value="${draft.disc||""}" placeholder="0" ${S.perm.maxDisc>0?"":"readonly"}></div>`:""}
 </div>
 <div class="alloc" id="allocBox" ${alloc?"":"hidden"}><b>נדרש מספר הקצאה</b><span class="hint">חשבונית ללקוח עוסק מעל ${NF.format(ALLOC_MIN)} ₪ לפני מע״מ.</span><input class="inp" id="d_alloc" inputmode="numeric" value="${esc(draft.alloc)}" placeholder="מספר הקצאה" aria-label="מספר הקצאה"></div>
 <div class="field"><label for="d_notes">הערה ללקוח</label><textarea class="inp" id="d_notes">${esc(draft.notes)}</textarea></div>`;
}
function refresh(){
 if(screen!=="edit"||!draft)return;
 const t=TYPES[draft.type],tt=tot(draft),c=custOf(draft);
 const tc=$("#totCard");
 if(tc){
  let prof="";
  if(S.perm.seeCost&&t.items&&draft.lines.length&&tt.costKnown){const pr=r2(tt.net-tt.cost),m=tt.net?pr/tt.net*100:0;prof=`<div class="profit ${pr<0?"neg":m<15?"low":""}"><span>רווח גולמי במסמך</span><b class="num">${money(pr)} · ${pct(m)}</b></div>`}
  tc.innerHTML=t.items?`<span class="h2">סיכום <small>${draft.lines.length} שורות · ${qf(tt.units||0)} יח׳</small></span>
   <div class="tots">${tt.disc?`<span>סכום ביניים</span><span>${money(tt.sub)}</span><span>הנחה ${draft.disc}%</span><span>−${money(tt.disc)}</span>`:""}
   ${vatOn(draft)?`<span>לפני מע״מ</span><span>${money(tt.net)}</span><span>מע״מ 18%</span><span>${money(tt.vat)}</span>`:""}
   <span class="g">${draft.type==="credit"?"סה״כ זיכוי":"סה״כ"}</span><span class="g num">${money(tt.total)}</span></div>${prof}`
   :`<span class="h2">קבלה</span><div class="tots"><span>יתרת החשבוניות</span><span>${money(tt.due)}</span></div><div class="hint">הסכום ואמצעי התשלום נרשמים בהפקה (F9).</div>`;
 }
 const ab=$("#allocBox");if(ab)ab.hidden=!(biz.mode==="m"&&(draft.type==="tax"||draft.type==="taxrc")&&c&&c.tax&&tt.net>=ALLOC_MIN);
 $("#sumLbl").textContent=t.items?(draft.lines.length?draft.lines.length+" שורות · "+(vatOn(draft)?"כולל מע״מ":"ללא מע״מ"):TYPES[draft.type].name):"קבלה"+(draft.closes.length?" על "+draft.closes.length+" חשבוניות":"");
 $("#sumVal").textContent=money(t.items?tt.total:tt.due);
 $("#btnIssue").innerHTML=(draft.pick?"תעודת משלוח מהליקוט":isSimple()?"הפקת "+TYPES[draft.type].short:"הפקה")+' <kbd class="kbonly">F9</kbd>';
 rsLive();store.set("draft",draft);
}
function moveSel(d){const n=draft.lines.length;if(!n)return;sel=sel<0?(d>0?0:n-1):Math.max(0,Math.min(n-1,sel+d));rLines();const el=$(`[data-line="${sel}"]`);el&&el.scrollIntoView({block:"nearest"})}
function bumpQty(i,d){const l=draft.lines[i];if(!l)return;l.qty=Math.max(0,r2(num(l.qty)+d));if(l.qty===0&&!draft.pick){draft.lines.splice(i,1);sel=Math.min(sel,draft.lines.length-1);toast("השורה הוסרה")}rLines();refresh();rPick()}

function addProduct(p,qty){
 qty=qty||1;const t=TYPES[draft.type];
 if(!t.items){toast("לקבלה אין פריטים. החליפו סוג מסמך",true);beep(false);return}
 if(draft.pick){
  const i=draft.lines.findIndex(l=>l.sku===p.sku&&l.need!=null);
  if(i<0){beep(false);toast(p.name+" לא בהזמנה",true);return}
  const l=draft.lines[i];l.qty=r2(num(l.qty)+qty);sel=i;
  if(l.qty>l.need){beep(false);toast("לוקט יותר מהנדרש: "+qf(l.qty)+" מתוך "+qf(l.need),true)}else{beep();if(l.qty===l.need)toast("✓ "+p.name+" הושלם")}
  rLines();refresh();rPick();return;
 }
 const ex=S.merge?draft.lines.findIndex(l=>l.sku===p.sku&&!l.src):-1;
 if(ex>=0){draft.lines[ex].qty=r2(num(draft.lines[ex].qty)+qty);sel=ex;beep();rLines();refresh();toast(p.name+" · כמות "+qf(draft.lines[ex].qty));const el=$(`[data-line="${sel}"]`);el&&el.scrollIntoView({block:"nearest"});return}
 const c=custOf(draft),cp=custPrice(c,p);
 draft.lines.push({sku:p.sku,name:p.name,unit:p.unit,qty,price:cp??p.price,disc:0,src:null});
 sel=draft.lines.length-1;beep();rLines();refresh();
 const el=$(`[data-line="${sel}"]`);el&&el.scrollIntoView({block:"nearest"});
 if(S.autoPopup)lineModal(sel,true);
}
function cmdEnter(v){
 v=v.trim();
 if(!v){if(sel>=0&&TYPES[draft.type].items)lineModal(sel);return}
 const pq=parseCmd(v),p=findProduct(pq.code);
 if(p){addProduct(p,pq.qty||1);return}
 const c=customers.find(c=>c.code===v);
 if(c){if(setCust(c.id)){beep();toast("לקוח: "+c.name)}return}
 if(!TYPES[draft.type].items){custModal(v);return}
 const m=PRODS.filter(x=>x.name.includes(pq.code));
 if(m.length===1){addProduct(m[0],pq.qty||1);return}
 catalogModal(pq.code,pq.qty);
}
function setCust(id){
 if(draft.srcDocs.length&&draft.cust&&draft.cust!==id){toast("המסמך מקושר למסמכים של לקוח אחר. נקו קודם את הטיוטה.",true);beep(false);return false}
 draft.cust=id;const c=custOf(draft);if(c&&c.terms&&TYPES[draft.type].terms)draft.terms=c.terms;
 if(c&&c.prices)draft.lines.forEach(l=>{if(!l.src&&c.prices[l.sku]!=null)l.price=c.prices[l.sku]});
 rEdit();return true;
}

 const p=P(l.sku),c=custOf(draft),perm=S.perm;
 const cost=prefCost(p),cp=p?custPrice(c,p):null,last=p&&c?lastSale(c.id,p.sku):null;
 const locked=l.max!=null&&!S.partial&&!draft.pick;
 const chips=[0,3,5,10,15,20].filter(x=>x<=perm.maxDisc);
 const focusSel=p?({qty:"#m_qty",price:perm.editPrice?"#m_price":"#m_qty",disc:perm.maxDisc>0?"#m_disc":"#m_qty"})[S.focus]:"#m_name";
 openModal(`<div class="mhead">${S.images?thumb(p?p.cat:"free"):""}<div class="grow" style="min-width:0">
   ${p?`<h3>${esc(l.name)}</h3><div class="hint"><span class="mono">${p.sku}</span> · ברקוד <span class="mono">${p.bc}</span> · ${CATS[p.cat]}</div><div class="stockrow">${Object.entries(p.stock).map(([w,q])=>`<span>${w}: <b class="num">${qf(q)}</b> ${esc(p.unit)}</span>`).join("")}</div>`
   :`<div class="field"><label for="m_name">תיאור הפריט או השירות</label><input class="inp" id="m_name" value="${esc(l.name)}" placeholder="למשל: הובלה, שעת עבודה"></div>`}
   ${l.src?`<div class="hint" style="margin-top:4px"><span class="srcchip">${TYPES[l.src.t].name} ${l.src.no}</span> יתרה פתוחה ${qf(l.max)}${locked?" · כמות נעולה (סגירה חלקית כבויה)":""}</div>`:""}

function readLine(){return{q:num($("#m_qty").value),pr:num($("#m_price").value),d:num($("#m_disc").value)}}
function calcLine(src){
 if(!M||!$("#m_qty"))return;const {q,pr}=readLine();const fin=$("#m_final");
 if(src==="final"){const f=num(fin.value);$("#m_disc").value=pr&&f!==pr?String(r2((1-f/pr)*100)):""}
 const dd=num($("#m_disc").value),unit=r2(pr*(1-dd/100));
 if(src!=="final")fin.value=String(unit);
 const line=r2(q*unit);$("#m_total").textContent=money(line);
 $("#m_vat").textContent=vatOn(draft)?"לפני מע״מ":"";
 $("#m_err").innerHTML=lineErrors(q,pr,dd).map(e=>`<div class="err">${e}</div>`).join("");
 const kp=$("#m_kp");
 if(kp&&M.cost!=null){const c=M.cost,pu=r2(unit-c),mg=unit?pu/unit*100:0,mk=c?pu/c*100:0,cl=pu<0?"bad":mg<15?"warn":"good";
  kp.innerHTML=`<div><small>עלות ליח׳</small><b class="num">${money(c)}</b></div><div><small>רווח ליח׳</small><b class="num ${cl}">${money(pu)}</b></div><div><small>% רווח מהמחיר</small><b class="num ${cl}">${pct(mg)}</b></div><div><small>% תוספת על עלות</small><b class="num ${cl}">${pct(mk)}</b><div class="hint">רווח בשורה ${money(r2(pu*q))}</div></div>`}
}
function lineErrors(q,pr,d){
 const e=[],perm=S.perm,l=draft.lines[M.i];if(!l)return e;const p=P(l.sku);
 if(!(q>0))e.push("כמות חייבת להיות גדולה מ-0");
 if(d<0||d>100)e.push("הנחה בין 0 ל-100%");
 else if(d>perm.maxDisc+1e-9)e.push(`ההנחה המקסימלית בהרשאה שלך היא ${perm.maxDisc}%`);
 const c=prefCost(p);if(p&&c!=null&&!perm.belowCost&&pr*(1-d/100)<c-1e-9)e.push(perm.seeCost?"המחיר נמוך מהעלות. נדרשת הרשאת מנהל":"המחיר נמוך מהמינימום המותר לך. פנו למנהל");
 if(l.max!=null&&!draft.pick&&q>l.max+1e-9)e.push(`הכמות גבוהה מהיתרה במסמך המקור (${qf(l.max)})`);
 if(!p&&$("#m_name")&&!$("#m_name").value.trim())e.push("כתבו תיאור לשורה");
 return e;
}
function saveLine(){

 if(lineErrors(q,pr,d).length){beep(false);calcLine();const f=$("#m_err .err");f&&f.animate&&f.animate([{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"none"}],{duration:180});return}
 const l=draft.lines[M.i];l.qty=q;l.price=pr;l.disc=d;if($("#m_name"))l.name=$("#m_name").value.trim();
 M.onCancel=null;closeModal();rLines();refresh();rPick();
}

function validate(){
 const t=TYPES[draft.type],c=custOf(draft);
 if(!c)return"בחרו לקוח (F2)";
 if(t.items&&!draft.lines.length)return"אין שורות במסמך";
 if(t.items&&draft.lines.some(l=>!String(l.name).trim()))return"יש שורה בלי תיאור";
 if(!draft.pick&&draft.lines.some(l=>l.max!=null&&num(l.qty)>l.max+1e-9))return"יש שורה עם כמות מעל היתרה במקור";
 if(draft.pick&&!draft.lines.some(l=>num(l.qty)>0))return"עוד לא לוקט אף פריט";
 if(num(draft.disc)>S.perm.maxDisc)return`הנחת המסמך מעל ${S.perm.maxDisc}% המותרים`;
 if(t.ref&&!String(draft.ref).trim())return"רשמו לאיזו חשבונית הזיכוי (F8)";
 return"";
}

function payRemain(){const t=TYPES[draft.type],tt=tot(draft),need=t.items?tt.total:tt.due,paid=tt.paid,r=r2(need-paid),el=$("#premain");if(!el)return;

function delLine(i){undoLine={i,l:draft.lines[i]};draft.lines.splice(i,1);if(Q.edit===i)resetQ(),rsQuick();rsLines();refresh();toast("נמחק: "+undoLine.l.name,false,{label:"ביטול",fn:()=>{draft.lines.splice(undoLine.i,0,undoLine.l);rsLines();refresh()}})}

 +`<div class="field"><label for="s_for">עבור <span class="muted">(לא חובה)</span></label><input class="inp" id="s_for" value="${esc(draft.notes)}" placeholder="למשל: מקדמה על הזמנה"></div>`;

function rsPay(){
 const box=$("#s_pay");if(!box)return;const t=TYPES[draft.type],need=sNeed();
 if(!draft.pays.length)draft.pays=[{m:"cash",amount:need||"",auto:true}];

  box.innerHTML=`<div class="s-methods" role="radiogroup" aria-label="אמצעי תשלום">${Object.entries(METHODS).map(([k,v])=>`<button role="radio" aria-checked="${p.m===k}" data-pm="${k}">${PAYIC[k]}<span>${v}</span></button>`).join("")}</div>

   ${p.m==="cheque"?`<div class="field"><label for="s_chq">מספר צ׳ק</label><input class="inp" id="s_chq" data-sp="chq" inputmode="numeric" value="${esc(p.chq||"")}"></div><div class="field"><label for="s_due">תאריך פירעון</label><input class="inp" type="date" id="s_due" data-sp="due" value="${p.due||draft.date}"></div>`:""}
   ${p.m==="transfer"||p.m==="app"?`<div class="field"><label for="s_ref">אסמכתא <span class="muted">(לא חובה)</span></label><input class="inp" id="s_ref" data-sp="refno" value="${esc(p.refno||"")}"></div>`:""}
  </div>

 }else{
  box.innerHTML=`<div class="stack" style="gap:8px">${draft.pays.map((p,i)=>`<div class="s-split" data-p="${i}"><select class="inp" data-spm="${i}" aria-label="אמצעי תשלום ${i+1}">${Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${p.m===k?"selected":""}>${v}</option>`).join("")}</select><input class="inp num" id="${i===0?"s_payfirst":"s_pa"+i}" data-pf="amount" inputmode="decimal" value="${p.amount}" aria-label="סכום ${i+1}" style="text-align:start"><button class="x" data-delpay="${i}" aria-label="הסרת תשלום ${i+1}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join("")}</div>
  <div class="row"><button class="btn sm soft" data-act="s_addpay">+ עוד אמצעי תשלום</button></div>
  <div id="s_change" class="s-change" aria-live="polite"></div>`;
 }

const PAYIC={cash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',credit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',transfer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 9h14l-3-3M20 15H6l3 3"/></svg>',cheque:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="1.5"/><path d="M6 14c2-3 3 1 5-1M14 14h4"/></svg>',app:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>'};
function rsLive(){
 if(!isSimple())return;const t=TYPES[draft.type],tt=tot(draft),need=sNeed();
 const sum=$("#s_sum");if(sum&&t.items)sum.innerHTML=draft.lines.length?`<div class="s-tots">${tt.disc?`<span>הנחת מסמך</span><span>−${money(tt.disc)}</span>`:""}${vatOn(draft)?`<span>לפני מע״מ</span><span class="num">${money(tt.net)}</span><span>מע״מ 18%</span><span class="num">${money(tt.vat)}</span>`:""}<span class="g">סה״כ</span><span class="g num">${money(tt.total)}</span></div>`:"";
 if(!t.pay)return;
 if(draft.pays.length===1&&draft.pays[0].auto!==false&&t.items){draft.pays[0].amount=need;const a=$("#s_amt");if(a&&document.activeElement!==a)a.value=need}
 const ch=$("#s_change");if(!ch)return;const paid=tot(draft).paid,r=r2((t.items?need:paid)-paid),p=draft.pays[0];
 if(draft.pays.length===1&&p.m==="cash"&&num(p.given)>0){const change=r2(num(p.given)-num(p.amount));ch.className="s-change "+(change>=0?"ok":"bad");ch.innerHTML=change>=0?`<span>עודף ללקוח</span><b class="num">${money(change)}</b>`:`<span>חסר</span><b class="num">${money(-change)}</b>`;return}
 if(t.items&&Math.abs(r)>0.009){ch.className="s-change bad";ch.innerHTML=`<span>${r>0?"חסר לתשלום":"שולם יותר מהסכום"}</span><b class="num">${money(Math.abs(r))}</b>`;return}
 ch.className="s-change";ch.innerHTML="";
}

/* issue */
function sIssue(){
 if(M)return;readQ();
 if(Q.name.trim()&&Q.edit<0){beep(false);toast("יש מוצר בשורה שעוד לא נוסף. Enter להוספה, Esc לניקוי",true);sFocus("#q_name");return}
 const t=TYPES[draft.type];
 if(!draft.cust)draft.cust="walkin";
 if(t.items&&!draft.lines.length){beep(false);toast("הוסיפו לפחות מוצר אחד",true);sFocus("#q_name");return}
 if(t.pay){
  if(draft.pays.some(p=>!(num(p.amount)>0))){beep(false);toast("רשמו סכום תשלום",true);sFocus("#s_amt");return}
  const tt=tot(draft);if(t.items&&Math.abs(r2(tt.total-tt.paid))>0.009){beep(false);toast(tt.total>tt.paid?"חסר "+money(tt.total-tt.paid)+" לתשלום":"התשלום גבוה מהסכום",true);return}
  const p=draft.pays[0];if(draft.pays.length===1&&p.m==="cash"&&num(p.given)>num(p.amount))p.change=r2(num(p.given)-num(p.amount));
  draft.pays.forEach(p=>{delete p.auto;delete p.given});
 }
 if(!t.pay)draft.pays=[];
 finalize();
}
function sDone(d){
 const tt=tot(d),ch=(d.pays||[]).reduce((a,p)=>a+num(p.change),0);
 openModal(`<div class="s-done"><div class="okmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h3>${label(d)} הופקה</h3><p>${esc(custOf(d)?.name||"")} · <b class="num">${money(tt.total)}</b></p>${ch?`<div class="s-change ok"><span>עודף ללקוח</span><b class="num">${money(ch)}</b></div>`:""}</div>
  <div class="mfoot"><button class="btn primary grow" data-act="s_new">מסמך חדש <kbd class="kbonly">Enter</kbd></button><button class="btn" data-view="${d.id}">הצגה</button><button class="btn" data-act="s_copy" data-id="${d.id}">העתקה לוואטסאפ</button></div>`,
 {focus:"[data-act=s_new]",enter:()=>{closeModal();sFocus("#s_cq")}});
}
function simpleKeys(e){
 const id=e.target.id;
 if(e.key==="F9"||(e.key==="Enter"&&(e.ctrlKey||e.metaKey))){e.preventDefault();return sIssue()}
 if(id==="s_cq"){
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const n=custOpts().length;chl=(chl+(e.key==="ArrowDown"?1:-1)+n)%n;return rsCsug()}
  if(e.key==="Enter"){e.preventDefault();const v=e.target.value.trim(),ex=customers.find(c=>c.code===v);if(ex){sCustQ=v;chl=0}return pickCustOpt(chl)}
  if(e.key==="Escape"){e.target.value="";sCustQ="";chl=0;return rsCsug()}
  return;
 }
 if(id==="s_tax"&&e.key==="Enter"){e.preventDefault();return sFocus(TYPES[draft.type].items?"#q_name":"#s_amt")}
 if(id==="q_name"){
  const o=prodOpts();
  if((e.key==="ArrowDown"||e.key==="ArrowUp")&&o.length){e.preventDefault();qhl=e.key==="ArrowDown"?(qhl+1)%o.length:(qhl<=0?o.length-1:qhl-1);return rsQsug()}
  if(e.key==="Enter"){e.preventDefault();return nameEnter()}
  if(e.key==="Escape"){e.preventDefault();resetQ();rsQuick();rsLines();return sFocus("#q_name")}
  return;
 }
 if(["q_code","q_qty","q_price","q_disc"].includes(id)){
  if(e.key==="Escape"){e.preventDefault();resetQ();rsQuick();rsLines();return sFocus("#q_name")}
  if(id==="q_qty"&&(e.key==="ArrowUp"||e.key==="ArrowDown")){e.preventDefault();e.target.value=Math.max(1,r2(num(e.target.value||1)+(e.key==="ArrowUp"?1:-1)));Q.qty=e.target.value;return qPreview()}
  if(e.key!=="Enter")return;e.preventDefault();readQ();
  if(id==="q_code"){const p=Q.code.trim()&&findProduct(Q.code.trim());if(p&&!Q.sku&&Q.edit<0&&!Q.name.trim()){return fillFromOpt({p})}return sFocus("#q_qty")}
  if(id==="q_qty")return sFocus($("#q_price").readOnly?"#q_disc":"#q_price");
  if(id==="q_price"){if(String(Q.price).trim()===""){beep(false);const m=$("#q_msg");m.className="q-msg bad";m.textContent="כתבו מחיר";return}if($("#q_disc").readOnly)return qAdd();return sFocus("#q_disc")}
  if(id==="q_disc")return qAdd();
 }
 if(e.target.dataset&&e.target.dataset.sline!==undefined&&e.target.classList.contains("s-line")){
  const i=+e.target.dataset.sline;
  if(e.key==="Enter"){e.preventDefault();return editLine(i)}
  if(e.key==="Delete"){e.preventDefault();delLine(i);return sFocus("#q_name")}
  if(e.key==="+"||e.key==="-"){e.preventDefault();sBump(i,e.key==="+"?1:-1);const r=$(`[data-sline="${i}"]`);r&&r.focus();return}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const r=$(`[data-sline="${i+(e.key==="ArrowDown"?1:-1)}"]`);r&&r.focus();return}
 }
 if(["s_amt","s_given","s_payfirst"].includes(id)||/^s_pa\d/.test(id)||(e.target.dataset&&e.target.dataset.sp)){
  if(e.key==="Enter"&&e.target.tagName!=="SELECT"){e.preventDefault();if(id==="s_amt"&&$("#s_given")&&!$("#s_given").value)return sFocus("#s_given");return sIssue()}
 }
 if(id==="s_for"&&e.key==="Enter"){e.preventDefault();return sFocus("#s_amt")}
}
function sBump(i,d){const l=draft.lines[i];if(!l)return;l.qty=r2(num(l.qty)+d);if(l.qty<=0){l.qty=1;return delLine(i)}rsLines();refresh()}

function selInfo(){const ds=lsel.map(docById).filter(Boolean);if(!ds.length)return null;return{ds,same:ds.every(d=>d.type===ds[0].type&&d.cust===ds[0].cust),t:ds[0].type}}

  :`<span class="grow">אפשר לסגור יחד רק מסמכים מאותו סוג ולאותו לקוח.</span><button class="btn sm" data-act="clrsel">ביטול הסימון</button>`;

function toggleL(id){lsel=lsel.includes(id)?lsel.filter(x=>x!==id):[...lsel,id];rRows()}
function closeTo(type,ids){const ds=ids.map(docById);if(!ds.length||ds.some(d=>!d||!isOpen(d))){toast("יש מסמך שכבר סגור",true);return}draft=newDraft(type);attach(draft,ids);lsel=[];go("edit");toast((ids.length>1?ids.length+" מסמכים":label(ds[0]))+" ← "+TYPES[type].name)}

function summaryText(d){
 const t=TYPES[d.type],tt=tot(d),c=custOf(d);
 let s=`${label(d)} · ${biz.name}\nלכבוד: ${c?c.name:""}\nתאריך: ${dfmt(d.date)}\n`;
 if(t.items)s+=d.lines.map(l=>`• ${l.name} × ${qf(num(l.qty))} ${l.unit||""} = ${money(lineNet(l))}`).join("\n")+"\n";
 if(vatOn(d)&&t.items)s+=`מע״מ 18%: ${money(tt.vat)}\n`;
 s+=`סה״כ: ${money(tt.total)}`;if(t.terms)s+=`\nלתשלום עד ${dfmt(termDate(d.terms,d.date))}`;return s+"\nתודה!";
}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast("הועתק. אפשר להדביק בוואטסאפ")}catch(e){openModal(`<div class="mhead"><h3 class="grow">העתיקו את הטקסט</h3>${X}</div><textarea class="inp" id="cpy" style="min-height:220px">${esc(s)}</textarea>`,{focus:"#cpy",init:()=>setTimeout(()=>$("#cpy")&&$("#cpy").select(),40)})}}

 $("#main").innerHTML=`<div class="stack"><div><h1 class="h1">הגדרות</h1><p class="sub">כל שינוי נשמר מיד ומשפיע על המסמך הבא. בגרסה המלאה ההרשאות מגיעות מהמשתמש המחובר.</p></div>

   ${tg("scanner","מסופון עם סורק מובנה","בלי מקלדת מסך בשדות הסריקה, כדי שלא תכסה את המסך")}

  <div class="card"><span class="h2">הרשאות</span>

   <label class="toggle"><input type="checkbox" data-p="seeCost" ${S.perm.seeCost?"checked":""}><span><b>רואה עלות, רווח וספקים</b><span>בחלון המוצר ובסיכום המסמך</span></span></label>
   <label class="toggle"><input type="checkbox" data-p="editPrice" ${S.perm.editPrice?"checked":""}><span><b>משנה מחיר</b><span>אחרת המחיר נעול למחירון</span></span></label>

   <div class="field" style="max-width:220px"><label for="s_maxd">הנחה מקסימלית %</label><input class="inp" id="s_maxd" data-p="maxDisc" inputmode="numeric" value="${S.perm.maxDisc}"></div>

   <div class="grid2">${[["name","שם העסק"],["id","ח.פ / ע.מ"],["phone","טלפון"],["addr","כתובת"],["agent","שם המפיק"]].map(([k,l])=>`<div class="field"><label for="b_${k}">${l}</label><input class="inp" id="b_${k}" data-b="${k}" value="${esc(biz[k])}"></div>`).join("")}</div>

function keysTable(){return `<table class="keys"><tbody>${[
 ["Alt+1…8","מסך הבית: מסמך חדש לפי סוג"],["F2","בחירת לקוח"],["F3","צירוף מסמכים פתוחים"],["F4","קטלוג"],["F7","תצוגה מקדימה"],["F8","פרטי המסמך"],["F9 / Ctrl+Enter","הפקה"],
 ["5*1001 Enter","מוצר וכמות בשורה אחת"],["↑ ↓","מעבר בין שורות"],["Enter","פתיחת השורה (כששורת הסריקה ריקה)"],["+ / -","כמות לשורה המסומנת"],["Delete","מחיקת השורה המסומנת"],
 ["↑ ↓","בחלון המוצר: כמות"],["Alt+1…5","בחלון התשלום: מזומן, אשראי, העברה, צ׳ק, ביט"],["Ctrl+N","לקוח חדש מתוך חיפוש לקוח"],["Space","סימון מסמך ברשימה"],["Alt+H / Alt+L / Alt+S","בית / מסמכים / הגדרות"],["Esc","סגירת חלון / ניקוי שורת הסריקה"]
 ].map(([k,v])=>`<tr><td>${k.split(" / ").map(x=>`<kbd>${x}</kbd>`).join(" ")}</td><td>${v}</td></tr>`).join("")}</tbody></table>`}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const b=e.target.closest("button,[data-row],[data-line],[data-sline]");if(!b)return;const d=b.dataset;
 if(b.closest("#toast"))return;
 if(d.stype){draft.type=d.stype;draft.pays=[];if(TYPES[d.stype].items){draft.closes=[];draft.srcDocs=[]}return rSimple()}
 if(d.scust!==undefined)return pickCustOpt(+d.scust);
 if(d.qsug!==undefined){const o=prodOpts()[+d.qsug];return o&&fillFromOpt(o)}
 if(d.sq){const i=+b.closest("[data-sline]").dataset.sline;return sBump(i,+d.sq)}
 if(d.sdel!==undefined){delLine(+d.sdel);return sFocus("#q_name")}
 if(d.sline!==undefined)return editLine(+d.sline);
 if(d.pm){const old=draft.pays[0]||{};draft.pays=[{m:d.pm,amount:TYPES[draft.type].items?sNeed():(old.amount||sNeed()||""),auto:old.auto!==false}];rsPay();return sFocus(d.pm==="cash"?"#s_given":"#s_amt")}
 if(d.rc)return toggleRc(d.rc);
 if(d.term){draft.terms=d.term;rsTerms();return refresh()}
 if(d.view&&M)closeModal();
 if(d.mclose!==undefined)return closeModal(true);
 if(d.nav){if(M)closeModal();lsel=[];return go(d.nav)}
 if(d.new)return startDoc(d.new);
 if(d.view)return go("view",d.view);
 if(d.pickc){const id=d.pickc;closeModal();if(screen!=="edit"){draft=draft||newDraft();go("edit")}if(setCust(id))beep();return}
 if(d.padd){const p=P(d.padd),q=M&&M.qty;if(S.autoPopup){closeModal();addProduct(p,q||1)}else{addProduct(p,q||1);prodList()}return}
 if(d.cat){catSel=d.cat;$$("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat===catSel));hl=0;prodList();$("#pq").focus();return}
 if(d.att){if(!b.disabled)toggleAtt(d.att);return}
 if(d.chip!==undefined){$("#m_disc").value=d.chip==="0"?"":d.chip;calcLine();return}
 if(d.mq){const f=$("#m_qty");if(!f.readOnly){f.value=Math.max(0,r2(num(f.value)+(+d.mq)));calcLine()}return}
 if(d.q){const i=+b.closest("[data-line]").dataset.line;sel=i;bumpQty(i,+d.q);return}
 if(d.line!==undefined){sel=+d.line;rLines();lineModal(sel);return}
 if(d.addpay)return addPay(d.addpay);
 if(d.delpay!==undefined){draft.pays.splice(+d.delpay,1);if(isSimple()){if(draft.pays.length===1)draft.pays[0].auto=true;rsPay()}else payRows();return}
 if(d.lst){LF.st=d.lst;lsel=[];return rList()}
 if(d.lty){LF.type=d.lty;lsel=[];return rList()}
 if(d.row){if(e.target.matches("input[type=checkbox]"))return;return go("view",d.row)}
 if(d.closeto)return closeTo(d.closeto,d.one?[d.one]:lsel.slice());
 if(d.pick)return startPick(d.pick);
 switch(d.act||b.id){
  case"btnIssue":return isSimple()?sIssue():issueStart();
  case"toadv":S.ui="advanced";store.set("settings",S);rEdit();return toast("מצב מתקדם. חזרה בכפתור ׳מצב פשוט׳");
  case"tosimple":S.ui="simple";store.set("settings",S);sel=-1;return rEdit();
  case"s_custchg":draft.cust=null;if(TYPES[draft.type].items===0){draft.closes=[];draft.srcDocs=[]}return rSimple();
  case"q_add":return qAdd();
  case"q_cancel":resetQ();rsQuick();rsLines();return sFocus("#q_name");
  case"s_split":{const p=draft.pays[0];p.auto=false;draft.pays.push({m:"credit",amount:Math.max(0,r2(sNeed()-num(p.amount)))||""});rsPay();return sFocus("#s_pa1")}
  case"s_addpay":{const paid=tot(draft).paid;draft.pays.push({m:"cash",amount:Math.max(0,r2(sNeed()-paid))||""});rsPay();return sFocus("#s_pa"+(draft.pays.length-1))}
  case"s_new":closeModal();return sFocus("#s_cq");
  case"s_copy":return copyText(summaryText(docById(d.id)));
  case"btnKeys":return openModal(`<div class="mhead"><h3 class="grow">קיצורי מקלדת</h3>${X}</div>${keysTable()}`);
  case"resume":return go("edit");
  case"cust":return custModal();
  case"catalog":return catalogModal();
  case"attach":return attachModal();
  case"attok":return applyAttach();
  case"free":draft.lines.push({sku:"",name:"",unit:"יח׳",qty:1,price:0,disc:0,src:null});sel=draft.lines.length-1;rLines();refresh();return lineModal(sel,true);
  case"discard":draft=newDraft(draft.type);sel=-1;rEdit();toast("הטיוטה נוקתה");return;
  case"lsave":return saveLine();
  case"ldel":{const i=M.i;M.onCancel=null;closeModal();draft.lines.splice(i,1);sel=Math.min(sel,draft.lines.length-1);rLines();refresh();return}
  case"newcust":return newCustForm($("#cq")?.value||"");
  case"backcust":return custModal();
  case"payok":return payOk();
  case"signok":draft.sig=padImg;closeModal();return S.confirm?confirmModal():finalize();
  case"signskip":draft.sig="";closeModal();return S.confirm?confirmModal():finalize();
  case"sigclr":return initPad.clear&&initPad.clear();
  case"confok":closeModal();return finalize();
  case"clrsel":lsel=[];return rRows();
  case"copysum":return copyText(summaryText(docById(viewId)));
  case"dup":{const s=docById(viewId);draft=newDraft(s.type);draft.lines=s.lines.map(l=>({sku:l.sku,name:l.name,unit:l.unit,qty:l.qty,price:l.price,disc:l.disc,src:null}));draft.disc=s.disc;go("edit");toast("שוכפל. בחרו לקוח");if(S.askCust)custModal();return}
  case"manual":{if(!confirmManual){confirmManual=true;rView();setTimeout(()=>{if(confirmManual){confirmManual=false;screen==="view"&&rView()}},4000);return}confirmManual=false;docById(viewId).manual=true;saveAll();rView();toast("המסמך נסגר ידנית");return}
  case"reset":["biz","customers","docs","series","settings","draft","screen","viewId"].forEach(k=>store.set(k,null));biz={...BIZ0};customers=JSON.parse(JSON.stringify(CUST0));docs=seedDocs();series=SERIES0();S={...SET0,perm:{...ROLES.manager}};draft=null;lsel=[];go("home");toast("נתוני הדוגמה אופסו");return;
 }
});
$("#btnIssue").id="btnIssue";
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="ncf")submitCust()});
document.addEventListener("input",e=>{
 const el=e.target;
 if(el.id==="s_cq"){sCustQ=el.value;chl=0;return rsCsug()}
 if(el.id==="q_name"){Q.name=el.value;if(Q.sku&&P(Q.sku)?.name!==el.value){Q.sku=null;Q.code="";Q.unit="";const c=$("#q_code");if(c){c.readOnly=false;c.value="";c.removeAttribute("tabindex")}const pr=$("#q_price");if(pr)pr.readOnly=false}qhl=0;el.classList.remove("bad");rsQsug();return qPreview()}
 if(/^q_(code|qty|price|disc)$/.test(el.id)){Q[el.id.slice(2)]=el.value;el.classList.remove("bad");return qPreview()}
 if(el.id==="s_tax"){el.value=el.value.replace(/\D/g,"");const h=$("#s_taxh");if(el.value.length>=8){if(validId(el.value)){const c=custOf(draft);c.tax=el.value;store.set("customers",customers);toast("ח.פ נשמר ללקוח");return rSimple()}h.className="hint bad";h.textContent="המספר לא תקין"}else{h.className="hint";h.textContent=""}return}
 if(el.id==="s_amt"){const p=draft.pays[0];p.amount=el.value.replace(",",".");p.auto=!TYPES[draft.type].items?false:p.auto;if(TYPES[draft.type].items&&num(p.amount)!==sNeed())p.auto=false;return rsLive()}
 if(el.id==="s_given"){draft.pays[0].given=el.value.replace(",",".");return rsLive()}
 if(el.dataset.sp){draft.pays[0][el.dataset.sp]=el.value;return}
 if(el.id==="s_for"){draft.notes=el.value;return store.set("draft",draft)}
 if(el.id==="cq"){hl=0;return custList()}
 if(el.id==="pq"){hl=0;return prodList()}
 if(el.id==="lq"){LF.q=el.value.trim();lcur=0;return rRows()}
 if(["m_qty","m_price","m_disc"].includes(el.id))return calcLine();
 if(el.id==="m_final")return calcLine("final");
 if(el.id==="nc_tax"){el.value=el.value.replace(/\D/g,"");const h=$("#nc_h");if(el.value.length>=8){const ok=validId(el.value);el.classList.toggle("bad",!ok);h.className="hint"+(ok?"":" bad");h.textContent=ok?"✓ מספר תקין":"המספר לא תקין"}else{el.classList.remove("bad");h.className="hint";h.textContent="נבדק לפי ספרת הביקורת"}return}
 if(el.dataset.pf){const p=draft.pays[+el.closest("[data-p]").dataset.p];p[el.dataset.pf]=el.dataset.pf==="amount"?el.value.replace(",","."):el.value;payRemain();return rsLive()}
 const map={d_date:"date",d_valid:"valid",d_supply:"supply",d_ref:"ref",d_disc:"disc",d_notes:"notes",d_alloc:"alloc"};
 if(map[el.id]){draft[map[el.id]]=el.id==="d_disc"?el.value.replace(",","."):el.value;const h=$("#dueH");if(h)h.textContent="עד "+dfmt(termDate(draft.terms,draft.date));if(el.id==="d_disc")el.classList.toggle("bad",num(el.value)>S.perm.maxDisc);refresh();return}
 if(el.dataset.b&&el.type!=="radio"){biz[el.dataset.b]=el.value;store.set("biz",biz);$("#bizName").textContent=biz.name;return}
 if(el.dataset.p==="maxDisc"){S.perm.maxDisc=Math.max(0,Math.min(100,num(el.value)));store.set("settings",S);return}
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.spm!==undefined){draft.pays[+el.dataset.spm].m=el.value;return}
 if(el.dataset.sp==="inst"){draft.pays[0].inst=el.value;return}
 if(el.id==="e_type"){draft.type=el.value;if(TYPES[draft.type].items)draft.closes=[];draft.srcDocs=draft.srcDocs.filter(id=>{const s=docById(id);return s&&sourcesFor(draft.type).includes(s.type)});draft.lines.forEach(l=>{if(l.src&&!draft.srcDocs.includes(l.src.d)){l.src=null;delete l.max}});draft.pays=[];sel=-1;rEdit();return}
 if(el.id==="d_terms"){draft.terms=el.value;$("#dueH").textContent="עד "+dfmt(termDate(draft.terms,draft.date));refresh();return}
 if(el.dataset.pf==="inst"){draft.pays[+el.closest("[data-p]").dataset.p].inst=el.value;return}
 if(el.dataset.ck){toggleL(el.dataset.ck);return}
 if(el.dataset.s){const k=el.dataset.s;S[k]=el.type==="checkbox"?el.checked:el.value;if(k==="role"){S.perm={...ROLES[el.value]};store.set("settings",S);render();toast("הרשאות: "+ROLES[el.value].label)}else{store.set("settings",S);toast("נשמר")}return}
 if(el.dataset.p&&el.type==="checkbox"){S.perm[el.dataset.p]=el.checked;store.set("settings",S);toast("נשמר");return}
 if(el.dataset.b==="mode"){biz.mode=el.value;if(!TYPES[S.defaultType].modes.includes(biz.mode))S.defaultType=biz.mode==="p"?"deal":"taxrc";store.set("biz",biz);store.set("settings",S);render();return}
});

document.addEventListener("keydown",e=>{
 const tag=e.target.tagName,inField=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT";
 if(M){
  if(e.key==="Escape"){e.preventDefault();return closeModal(true)}
  if(e.ctrlKey&&e.code==="KeyN"&&$("#cq")){e.preventDefault();return newCustForm($("#cq").value)}
  if(e.target.id==="m_qty"&&(e.key==="ArrowUp"||e.key==="ArrowDown")){e.preventDefault();if(!e.target.readOnly){e.target.value=Math.max(0,r2(num(e.target.value)+(e.key==="ArrowUp"?1:-1)));calcLine()}return}
  M.key&&M.key(e);if(e.defaultPrevented)return;
  if(e.key==="Enter"&&!e.shiftKey&&tag!=="TEXTAREA"&&M&&M.enter&&(tag!=="BUTTON"||e.target.closest(".plist"))){e.preventDefault();M.enter(e)}
  return;
 }
 if(e.altKey&&["KeyH","KeyL","KeyS"].includes(e.code)){e.preventDefault();lsel=[];return go({KeyH:"home",KeyL:"list",KeyS:"settings"}[e.code])}
 if(e.key==="?"&&!inField){e.preventDefault();return $("#btnKeys").click()}
 if(screen==="edit"&&isSimple())return simpleKeys(e);
 if(screen==="home"){
  if(e.altKey&&/^Digit[1-9]$/.test(e.code)){const n=+e.code.slice(5);if(typeList()[n-1]){e.preventDefault();return startDoc(typeList()[n-1][0])}}
  if(e.target.id==="homeScan"&&e.key==="Enter"){e.preventDefault();const v=e.target.value;e.target.value="";return homeEnter(v)}
  if(e.key==="F2"){e.preventDefault();draft=newDraft();go("edit");return custModal()}
  return;
 }
 if(screen==="edit"){
  if(e.key==="F2"){e.preventDefault();return custModal()}
  if(e.key==="F3"){e.preventDefault();return attachModal()}
  if(e.key==="F4"){e.preventDefault();return TYPES[draft.type].items&&catalogModal()}
  if(e.key==="F7"){e.preventDefault();return confirmModal()}
  if(e.key==="F8"){e.preventDefault();const dc=$("#detCard");dc.open=true;$("#d_date").focus();return}
  if(e.key==="F9"||(e.key==="Enter"&&(e.ctrlKey||e.metaKey))){e.preventDefault();return issueStart()}
  if(e.target.id==="cmd"){
   const v=e.target.value;
   if(e.key==="Enter"){e.preventDefault();e.target.value="";return cmdEnter(v)}
   if(e.key==="Escape"){e.target.value="";sel=-1;return rLines()}
   if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();return moveSel(e.key==="ArrowDown"?1:-1)}
   if(!v&&sel>=0&&(e.key==="+"||e.key==="-")){e.preventDefault();return bumpQty(sel,e.key==="+"?1:-1)}
   if(!v&&sel>=0&&e.key==="Delete"){e.preventDefault();draft.lines.splice(sel,1);sel=Math.min(sel,draft.lines.length-1);rLines();refresh();return toast("השורה נמחקה")}
   return;
  }
  if(!inField&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey)focusCmd();
  return;
 }
 if(screen==="list"){
  const inSearch=e.target.id==="lq";
  if(inField&&!inSearch&&e.target.type!=="checkbox")return;
  if(inSearch&&!["ArrowDown","ArrowUp","Enter"].includes(e.key))return;
  const L=filtered();
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();lcur=Math.max(0,Math.min(L.length-1,lcur+(e.key==="ArrowDown"?1:-1)));rRows();const r=$(".dr.cur");r&&r.scrollIntoView({block:"nearest"});return}
  if(e.key===" "&&!inSearch&&L[lcur]&&S.multiClose&&isOpen(L[lcur])&&targetsFor(L[lcur].type).length){e.preventDefault();return toggleL(L[lcur].id)}
  if(e.key==="Enter"&&L[lcur]){e.preventDefault();return go("view",L[lcur].id)}
  return;
 }
 if(screen==="view"&&!inField){
  if(e.key==="Escape"){e.preventDefault();return go("list")}
  const n=parseInt(e.key,10),btns=$$("[data-closeto][data-one]");if(n>=1&&btns[n-1]){e.preventDefault();btns[n-1].click()}
 }
});

if(screen==="edit"&&!draft)screen="home";
if(screen==="view"&&!docById(viewId))screen="home";
render();
})();
</script>
